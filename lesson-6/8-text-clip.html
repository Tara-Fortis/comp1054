<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Text Clipping</title>
	<style>
		body {
			background-color: black;
		}
		h1 {
			font: 1200%/1.2 Impact, sans-serif;
			text-align: center;
			/* STEP 1: Apply the gradient that you generated on the previous page as the background for the <h1> element, or use the photo of a sunset in the img/ directory */
				/* Permalink - use to edit and share this gradient: https://colorzilla.com/gradient-editor/#ff1a00+0,bf00af+30,f2f200+79,ff1a00+100 */
			background: radial-gradient(ellipse at center, #ff1a00 0%,#bf00af 30%,#f2f200 79%,#ff1a00 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
			/* STEP 2: Set the text color to transparent (dangerous) */
				color: transparent;
			/* STEP 3: Set the background-clip (and -webkit-background-clip) property to text */
				-webkit-background-clip: text;
				background-clip: text;
			/* STEP 4: Apply another non-standard visual effect -webkit-text-stroke-color (and width) */

		}
		h2 {
			font: 1000%/1.2 Impact, sans-serif;
			text-align: center;
			color: white;
			-webkit-text-stroke: 30px red;
			paint-order: stroke fill;
		}
		/* "Florida gulf coast" By Mmacbeth - Own work, CC0, https://commons.wikimedia.org/w/index.php?curid=39319981 */
	</style>
</head>
<body>
	<h1>Text Clipping</h1>
	<h2>Text stroke</h2>
</body>
</html>
